# chrony.service skips itself in a container (ConditionVirtualization=!container), which a VM on
# a Docker or Incus host is: its clock is the host's. Ubuntu's chrony-wait.service has no such
# condition, so there it waited three minutes for a daemon that never starts, failed, and held
# time-sync.target back that long. It takes chrony's condition; on a microVM nothing changes.
[Unit]
ConditionVirtualization=!container
