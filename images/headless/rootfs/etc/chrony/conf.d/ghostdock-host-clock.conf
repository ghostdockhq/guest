# The host's clock as a time source that needs no network: /dev/ptp0 is the KVM PTP clock, which
# reads the host's own clock (kept by the host's NTP). chrony uses it next to Ubuntu's NTS servers
# and alone when a firewall blocks those. Without it, a Server's clock drifted between the host's
# clock pushes (about 0.7 s a day): https://docs.ghostdock.ai/vms/ubuntu-differences
refclock PHC /dev/ptp0 poll 2 dpoll -2 refid HOST
