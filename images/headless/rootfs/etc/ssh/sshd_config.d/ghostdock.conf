# The image's defaults for SSH; the server is the user's, so they may
# change them. No passwords: ghost has none. No root login, as on Ubuntu's cloud images: ghost
# has passwordless sudo. Keys in ~/.ssh/authorized_keys work, as on any server.
#
# Ghostdock's own logins need nothing here: the platform's generator gives sshd the host's user
# CA and the principals command on its command line (base image, /usr/lib/gdo/os/sshd), so
# removing this file or tidying sshd_config cannot lock Ghostdock out.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
