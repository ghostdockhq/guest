# yaml-language-server: $schema=https://docs.ghostdock.ai/schemas/requirements/module-v2.json
version: 2
release: 2.1.0
title: Claude Remote Control
description: >-
  Runs claude remote-control in a folder as a service of the VM's login user, so you work with
  Claude Code on the VM from claude.ai or the Claude app. It starts again after every boot and
  brings back the sessions it served before (for about four hours after it stopped). It answers
  Remote Control's one-time "Enable Remote Control?" for the login user, keeps a git checkout in
  the folder healthy after a power-off, and waits for a new sign-in when claude.ai refuses the
  login. Signs in with ghostdock/claude-sign-in.
with:
  folder:
    title: Folder
    description: >-
      Where Claude Code runs, usually a repository: an absolute path, or one starting with ~/ for
      the login user's home. Something else creates it, such as a requirement that clones it.
  permission-mode:
    title: Permission mode
    description: >-
      Claude Code's --permission-mode: default, acceptEdits, plan or bypassPermissions.
      bypassPermissions runs every tool without asking.
    default: default
  chrome:
    title: Claude in Chrome
    description: >-
      true to start with --chrome, so Claude can use the VM's Chrome. Needs Chrome
      (ghostdock/google-chrome) and the Claude in Chrome extension, signed in to the same account.
    default: 'false'
uses:
  - module: ghostdock/claude-sign-in@2
touches:
  root: true
  hosts: [claude.ai, api.anthropic.com]
requirements:
  - id: folder
    title: The folder exists
    description: Waits for the folder; whatever creates it (a clone, a script) satisfies it.
    check: test -d "$(sh "$GHOSTDOCK_MODULE_DIR/folder.sh")"
  - id: repository-health
    title: The folder's git checkout is healthy
    description: >-
      After a power-off without a clean shutdown, removes stale git locks and empty objects,
      restores an empty branch from its reflog, rebuilds a broken index from HEAD and fetches
      what is missing (at most once per boot), never touching the working tree. Checks
      connectivity only, once per boot. Remote Control does not wait for it. A folder that is not
      itself a git checkout passes.
    dependsOn: [folder]
    interval: 3600
    timeout: 900
    check: sh "$GHOSTDOCK_MODULE_DIR/repo-health.sh" check
    apply:
      run: sh "$GHOSTDOCK_MODULE_DIR/repo-health.sh" repair
  - id: folder-trusted
    title: Claude Code trusts the folder
    description: Remote Control asks whether to trust a new folder, with no terminal to ask on.
    dependsOn: [folder, claude-sign-in]
    check: sh "$GHOSTDOCK_MODULE_DIR/settings.sh" check-trust
    apply:
      run: sh "$GHOSTDOCK_MODULE_DIR/settings.sh" trust
  - id: bypass-prompt
    title: Bypass permissions starts without a prompt
    description: >-
      Only with permission-mode bypassPermissions: a session without a terminal cannot answer
      Claude Code's warning.
    dependsOn: [claude-sign-in]
    check: sh "$GHOSTDOCK_MODULE_DIR/settings.sh" check-bypass
    apply:
      run: sh "$GHOSTDOCK_MODULE_DIR/settings.sh" bypass
  - id: use-hooks
    title: Claude Code says when it is used
    description: >-
      Hooks that report a prompt, and every tool Claude runs for it, as use of the VM for 15
      minutes (ghostdock-step busy), so the VM does not go to sleep under a session that works,
      and sleeps after its idle time once the session waits.
    dependsOn: [claude-sign-in]
    check: sh "$GHOSTDOCK_MODULE_DIR/settings.sh" check-hooks
    apply:
      run: sh "$GHOSTDOCK_MODULE_DIR/settings.sh" hooks
  - id: chrome-extension
    title: Claude in Chrome
    description: >-
      Only with chrome true. On the VM's desktop, open Chrome, add Claude in Chrome from
      https://chromewebstore.google.com/detail/fcoeoabgfenejglbffodgkkbkcdhcgfn and sign it in
      with the same claude.ai account, then click Done.
    dependsOn: [claude-sign-in]
    check: sh "$GHOSTDOCK_MODULE_DIR/chrome-extension.sh"
    apply:
      input:
        kind: confirm
        label: Add Claude in Chrome to the VM's Chrome and sign it in
  - id: service
    title: Remote Control running
    user: root
    dependsOn: [folder-trusted, bypass-prompt, use-hooks, chrome-extension]
    interval: 60
    check: sh "$GHOSTDOCK_MODULE_DIR/service.sh" check
    apply:
      run: sh "$GHOSTDOCK_MODULE_DIR/service.sh" install
    absent:
      check: sh "$GHOSTDOCK_MODULE_DIR/service.sh" check-removed
      apply:
        run: sh "$GHOSTDOCK_MODULE_DIR/service.sh" remove
